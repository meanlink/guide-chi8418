name: guide-chi
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-guide-chi}-db
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LocalAnalysis2026}
    ports: ["${DB_PORT:-17704}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U app -d analysis"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-guide-chi}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-guide-chi}-backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://app:${DB_PASSWORD:-LocalAnalysis2026}@db:5432/analysis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-guide-chi-development-only}
      SEED_DEMO: ${SEED_DEMO:-true}
      ARTIFACT_DIR: /artifacts
      SEGMENT_SIZE: ${SEGMENT_SIZE:-40}
      SEGMENT_LEASE_SECONDS: ${SEGMENT_LEASE_SECONDS:-120}
      SEGMENT_MAX_ATTEMPTS: ${SEGMENT_MAX_ATTEMPTS:-3}
    ports: ["${BACKEND_PORT:-19204}:8000"]
    volumes: ["analysis-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 4s
      timeout: 3s
      retries: 35
      start_period: 15s
  worker:
    build: ./backend
    # 故意不设 container_name：允许 `docker compose up -d --scale worker=2` 加开执行进程，
    # 分段租约与 epoch 栅栏保证并发抢占时每条计数只汇入一次。
    command: ["python", "-m", "src.worker"]
    environment: *app-env
    volumes: ["analysis-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<30"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-guide-chi}-frontend
    ports: ["${FRONTEND_PORT:-18204}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 4s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  analysis-artifacts:
